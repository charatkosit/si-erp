services:
  frontend:
    image: nginx:1.30.5-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [backend]
  backend:
    image: node:24.21.0-bookworm-slim
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    expose: ["3000"]
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_app -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.2-trixie
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:?copy .env.example to .env}
    volumes: ["seaweedfs_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  seaweedfs_data:
